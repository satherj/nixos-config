# generated by `theme` ({{id}}), do not edit
# uosc UI colours: accent for the seek bar/selection, crust panels, palette text
script-opts-append=uosc-color=foreground={{bare_accent}},foreground_text={{bare_crust}},background={{bare_crust}},background_text={{bare_text}},curtain={{bare_crust}},success={{bare_green}},error={{bare_red}},match={{bare_accent}},heatmap={{bare_accent}}
# OSD text (messages, stats) in the palette too
osd-color="{{text}}"
osd-border-color="{{crust}}"
