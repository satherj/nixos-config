# Video player: mpv with the uosc UI (seek bar with thumbfast previews, right-click menu).
# Default for video files via xdg.mime in configuration.nix.

# uosc replaces the stock on-screen controller and bar
osc=no
osd-bar=no
# no window decorations; uosc draws its own title bar when floating
border=no

hwdec=auto-safe
vo=gpu-next
# stay on the last frame instead of closing, and resume where you left off
keep-open=yes
save-position-on-quit=yes
autofit-larger=90%x90%

screenshot-directory=~/Pictures/Screenshots
screenshot-template="mpv %F %wH.%wM.%wS"

# colours come from the `theme` command (generated, untracked)
include="~~/theme.conf"
